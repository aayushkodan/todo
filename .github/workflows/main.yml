name: todo-workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      
      - name: Run CI pipeline
        run: echo "Starting CI/CD pipeline for todo-backend"
      
      - name: checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Check Java version
        run: java --version
      
